apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanoinference-deployment
  labels:
    app: nanoinference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nanoinference
  template:
    metadata:
      labels:
        app: nanoinference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: nanoinference-engine
        image: nanoinference:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "8Gi"
            cpu: "4"
          requests:
            memory: "4Gi"
            cpu: "2"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nanoinference-service
spec:
  type: ClusterIP
  selector:
    app: nanoinference
  ports:
  - port: 8000
    targetPort: 8000
    name: http